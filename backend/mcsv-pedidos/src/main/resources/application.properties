spring.application.name=pedidos

server.port=8082

spring.datasource.url=jdbc:postgresql://database-1.cmeovvhpxa89.us-east-1.rds.amazonaws.com:5432/pedidos_db
spring.datasource.username=admin_db
spring.datasource.password=lavacleanmaster1
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
